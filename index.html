<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>University Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
    margin: 0;
}

#map {
    width: 100%;
    height: 600px;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([20, 0], 2);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

fetch('https://fkc-s.github.io/partner-map/universities.geojson')

.then(response => response.json())

.then(data => {

    const geoLayer = L.geoJSON(data, {

pointToLayer: function(feature, latlng){

    let iconFile = "orange-pin.png";

    if(feature.properties.color === "#db7093"){
        iconFile = "red-pin.png";
    }

    if(feature.properties.color === "#1e90ff"){
        iconFile = "blue-pin.png";
    }

    if(feature.properties.color === "#3cb371"){
        iconFile = "green-pin.png";
    }

    const customIcon = L.icon({
        iconUrl: iconFile,
        iconSize: [24, 24],
        iconAnchor: [12, 41],
        popupAnchor: [0, -35]
    });

    return L.marker(latlng,{
        icon: customIcon
    });

},

        onEachFeature: function(feature, layer){

            const p = feature.properties;

            layer.bindPopup(

                '<strong>' +
                p.institution_name +
                '</strong><br><br>' +

                p.partner_organization +
                '<br><br>' +

                '所在地：' +
                p.location_ja +
                '<br>' +

                'Location：' +
                p.location_en +
                '<br><br>' +

                '協定種別：' +
                p.agreement_type_ja +
                '<br>' +

                'Agreement Type：' +
                p.agreement_type_en +
                '<br><br>' +

                '<a href="' +
                p.url +
                '" target="_blank">詳細を見る</a>'

            );

        }

    }).addTo(map);

    map.fitBounds(geoLayer.getBounds());

})

.catch(error => {

    console.error('GeoJSONエラー:', error);

});

</script>

</body>
</html>
